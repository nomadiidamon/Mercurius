; project.ini
;
; Single source of truth for metadata shared across the C++ and Python
; implementations. Both build systems (premake5 on the C++ side, the Python
; packaging/build scripts on the Python side) should parse this file rather
; than duplicating these values in language-specific manifests.
;
; Keep keys flat and simple (INI has no native nesting) so both a C++ INI
; parser and Python's configparser can read it without custom logic.

[project]
name = Mercurius
python_package = mercurius-events
version = 0.5.1
description = "Mercurius: Queue based pub/sub event system."
homepage = https://github.com/nomadiidamon/Mercurius
license = MIT

[contributors]
; Comma-separated list; expand as needed, or switch to one key per person
; (e.g. contributor.1, contributor.2) if you want per-person metadata later.
maintainers = Damon S. Green II (nomadiidamon)
contributors =

[compatibility]
; Minimum/target language versions both implementations should track.
cpp_standard = c++17
python_requires = >=3.10

[build]
; Freeform notes/flags both build scripts may want to agree on.
default_build_type = release
