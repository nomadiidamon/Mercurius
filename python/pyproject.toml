[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mercurius-events"
dynamic = ["version", "description", "readme", "license", "authors", "requires-python", "urls"]  # from ../project.ini via setup.py

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]

# Where pytest looks for tests.
testpaths = ["tests"]
pythonpath = ["src", "tools"]

# Standard test discovery patterns.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Registered markers.
markers = []

# Fail loudly on unknown markers.
addopts = "--strict-markers -ra"