[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mercurius"
dynamic = ["version"]  # MAJOR.MINOR.PATCH, defined once as Mercurius.__version__
description = "Mercurius: Queue based pub/sub event system"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "nomad_ii_damon" }
]

requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
homepage = "https://github.com/nomadiidamon/Mercurius"

[tool.setuptools.dynamic]
version = { attr = "Mercurius.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]

# Where pytest looks for tests.
testpaths = ["tests"]
pythonpath = ["src", "tools"]

# Standard test discovery patterns.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Registered markers.
markers = []

# Fail loudly on unknown markers.
addopts = "--strict-markers -ra"